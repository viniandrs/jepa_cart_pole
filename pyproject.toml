[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jepacartpole"
version = "0.1.0"
description = "JEPA World Model for CartPole-v1: Comparing VAE and Transfer Learning Encoders"
readme = "CLAUDE.md"
requires-python = ">=3.8"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "gymnasium>=1.2.3",
    "h5py>=3.16.0",
    "matplotlib>=3.10.3",
    "numpy>=1.26.4",
    "opencv-python>=4.9.0.80",
    "pillow>=11.2.1",
    "pygame>=2.6.1",
    "scikit-learn>=1.9.0",
    "torch>=2.11.0",
    "torchsummary>=1.5.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jepacartpole*"]
